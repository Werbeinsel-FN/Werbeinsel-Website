version: 0.2

env:
  variables:
    LIGHTSAIL_HOST: "3.126.252.21"
    GIT_BRANCH: "main"

phases:
  install:
    runtime-versions:
      nodejs: 16
    commands:
      - echo ">> Instaliram SSH klijent i AWS CLI (ako treba)"
      - "if command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y openssh-client awscli; elif command -v yum >/dev/null 2>&1; then yum install -y openssh-clients awscli; else echo 'Preskačem instalaciju'; fi"

  pre_build:
    commands:
      - echo ">> Učitavam privatni SSH ključ iz SSM"
      - "mkdir -p ~/.ssh"
      - "aws ssm get-parameter --name '/werbeinsel/ssh_private_key' --with-decryption --query 'Parameter.Value' --output text > ~/.ssh/id_rsa"
      - "chmod 600 ~/.ssh/id_rsa"

      - echo ">> Dodajem Lightsail host key"
      - "ssh-keyscan -H \"$LIGHTSAIL_HOST\" >> ~/.ssh/known_hosts"

      - echo ">> SSH alias 'lightsail' (user=bitnami)"
      - "printf 'Host lightsail\n  HostName %s\n  User bitnami\n  IdentityFile ~/.ssh/id_rsa\n  IdentitiesOnly yes\n  BatchMode yes\n  ServerAliveInterval 60\n  ServerAliveCountMax 10\n' \"$LIGHTSAIL_HOST\" > ~/.ssh/config"
      - "chmod 600 ~/.ssh/config"

      - echo ">> Test SSH konekcije"
      - "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes lightsail 'echo OK-SSH && whoami && hostname'"

  build:
    commands:
      - echo ">> Backup wp-config.php (ako postoji)"
      - "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes lightsail 'cd /opt/bitnami/wordpress || cd /opt/bitnami/wordpress/htdocs; if [ -f wp-config.php ]; then cp wp-config.php /tmp/wp-config.server-backup.$(date +%F-%H%M%S); fi'"

      - echo ">> Deploy sa origin/${GIT_BRANCH}"
      - "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes lightsail 'cd /opt/bitnami/wordpress || cd /opt/bitnami/wordpress/htdocs; git update-index --skip-worktree wp-config.php || true; git fetch origin; git checkout ${GIT_BRANCH} || git checkout -b ${GIT_BRANCH}; git reset --hard origin/${GIT_BRANCH}; find . -name .DS_Store -delete || true; find . -name \"._*\" -delete || true; LATEST_BACKUP=$(ls -1t /tmp/wp-config.server-backup.* 2>/dev/null | head -n 1 || true); if [ -n \"${LATEST_BACKUP:-}\" ]; then cp ${LATEST_BACKUP} wp-config.php; fi; sudo /opt/bitnami/ctlscript.sh restart apache || sudo /opt/bitnami/ctlscript.sh restart; echo Deploy završen.'"

artifacts:
  files:
    - '**/*'
  discard-paths: yes
