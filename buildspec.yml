version: 0.2
phases:
  pre_build:
    commands:
      - set -e
      - eval "$(ssh-agent -s)"
      # snimi ključ iz varijable u privremeni fajl
      - KEY_FILE=/tmp/lightsail_key.pem
      - printf '%s' "$LIGHTSAIL_KEY" | tr -d '\r' > "$KEY_FILE"
      - chmod 600 "$KEY_FILE"
      # pokušaj učitavanje; ako je key unet sa literalnim \n, premapiraj ih u realne nove redove
      - ssh-add "$KEY_FILE" || ( printf '%b' "$LIGHTSAIL_KEY" | tr -d '\r' > "$KEY_FILE" && chmod 600 "$KEY_FILE" && ssh-add "$KEY_FILE" )
      - ssh-add -l
      - mkdir -p ~/.ssh
      - ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts
      - ssh-keyscan -H github.com >> ~/.ssh/known_hosts
  build:
    commands:
      - ssh -o IdentitiesOnly=yes bitnami@"$LIGHTSAIL_HOST" 'bash -lc "
          cd /opt/bitnami/wordpress &&
          git fetch origin &&
          git reset --hard origin/main &&
          sudo /opt/bitnami/ctlscript.sh restart apache
        "'
