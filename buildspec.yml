version: 0.2

env:
  variables:
    LIGHTSAIL_HOST: "3.126.252.21"   # po potrebi promeni ili prepiši varijablom u CodeBuild-u
    GIT_BRANCH: "main"

phases:
  install:
    runtime-versions:
      nodejs: 16
    commands:
      - echo ">> Instaliram SSH klijent i AWS CLI (ako treba)"
      - |
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update && apt-get install -y openssh-client awscli
        elif command -v yum >/dev/null 2>&1; then
          yum install -y openssh-clients awscli
        else
          echo "Nepoznat paket menadžer; pretpostavljam da su openssh i awscli već instalirani."
        fi

  pre_build:
    commands:
      - echo ">> Učitavam privatni SSH ključ iz SSM u ~/.ssh/id_rsa"
      - mkdir -p ~/.ssh
      - aws ssm get-parameter --name "/werbeinsel/ssh_private_key" --with-decryption --query "Parameter.Value" --output text > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa

      - echo ">> Dodajem Lightsail host key u known_hosts"
      - ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts

      - echo ">> Podešavam SSH alias 'lightsail' (user=bitnami)"
      - |
        cat > ~/.ssh/config <<EOF
        Host lightsail
          HostName $LIGHTSAIL_HOST
          User bitnami
          IdentityFile ~/.ssh/id_rsa
          IdentitiesOnly yes
          BatchMode yes
          ServerAliveInterval 60
          ServerAliveCountMax 10
EOF
      - chmod 600 ~/.ssh/config

      - echo ">> Testiram SSH konekciju"
      - ssh -o StrictHostKeyChecking=yes -vvv lightsail 'echo OK-SSH && whoami && hostname'

  build:
    commands:
      - echo ">> Deploy na Lightsail (grana: $GIT_BRANCH)"
      - |
        ssh lightsail 'bash -lc "
          set -euo pipefail

          # 1) Idi u WP dir (neki Bitnami buildovi koriste /htdocs)
          cd /opt/bitnami/wordpress || cd /opt/bitnami/wordpress/htdocs

          # 2) Sačuvaj server-specifični wp-config.php (da ga ne pregazimo)
          if [ -f wp-config.php ]; then
            cp wp-config.php /tmp/wp-config.server.backup.\$(date +%F-%H%M%S)
          fi

          # 3) Ako je wp-config.php pod Git-om, ignorisi lokalne izmene ubuduće
          git update-index --skip-worktree wp-config.php || true

          # 4) Poravnaj radnu kopiju na remote granu
          git fetch origin
          git checkout $GIT_BRANCH || git checkout -b $GIT_BRANCH
          git reset --hard origin/$GIT_BRANCH

          # (opciono) Očisti macOS meta fajlove iz radne kopije
          find . -name \".DS_Store\" -delete || true
          find . -name \"._*\" -delete || true

          # 5) Vrati poslednji bekap wp-config.php ako postoji
          LATEST_BACKUP=\$(ls -1t /tmp/wp-config.server.backup.* 2>/dev/null | head -n 1 || true)
          if [ -n \"\${LATEST_BACKUP:-}\" ]; then
            cp \"\${LATEST_BACKUP}\" wp-config.php
          fi

          # 6) Restartuj Apache
          sudo /opt/bitnami/ctlscript.sh restart apache || sudo /opt/bitnami/ctlscript.sh restart

          echo \"Deploy završen.\"
        "'

artifacts:
  files:
    - '**/*'
  discard-paths: yes
