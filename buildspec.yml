version: 0.2

env:
  variables:
    LIGHTSAIL_HOST: "3.126.252.21"  # promeni ako treba
    GIT_BRANCH: "main"

phases:
  install:
    runtime-versions:
      nodejs: 16
    commands:
      - echo ">> Instaliram SSH klijent i AWS CLI (ako treba)"
      - |
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update && apt-get install -y openssh-client awscli
        elif command -v yum >/dev/null 2>&1; then
          yum install -y openssh-clients awscli
        else
          echo "Preskačem instalaciju: paket menadžer nije apt/yum."
        fi

  pre_build:
    commands:
      - echo ">> Učitavam privatni SSH ključ iz SSM u ~/.ssh/id_rsa"
      - mkdir -p ~/.ssh
      - aws ssm get-parameter --name "/werbeinsel/ssh_private_key" --with-decryption --query "Parameter.Value" --output text > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa

      - echo ">> Dodajem Lightsail host key u known_hosts"
      - ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts

      - echo ">> Pravim SSH config sa aliasom 'lightsail' (user=bitnami)"
      - |
        printf '%s\n' \
        "Host lightsail" \
        "  HostName ${LIGHTSAIL_HOST}" \
        "  User bitnami" \
        "  IdentityFile ~/.ssh/id_rsa" \
        "  IdentitiesOnly yes" \
        "  BatchMode yes" \
        "  ServerAliveInterval 60" \
        "  ServerAliveCountMax 10" > ~/.ssh/config
      - chmod 600 ~/.ssh/config

      - echo ">> Testiram SSH konekciju"
      - ssh -o BatchMode=yes -o StrictHostKeyChecking=yes lightsail 'echo OK-SSH && whoami && hostname'

  build:
    commands:
      - echo ">> Deploy na Lightsail (grana: $GIT_BRANCH)"
      - |
        ssh -o BatchMode=yes -o StrictHostKeyChecking=yes lightsail "bash -lc '
          set -euo pipefail
          cd /opt/bitnami/wordpress || cd /opt/bitnami/wordpress/htdocs
          if [ -f wp-config.php ]; then cp wp-config.php /tmp/wp-config.server.backup.\$(date +%F-%H%M%S); fi
          git update-index --skip-worktree wp-config.php || true
          git fetch origin
          git checkout $GIT_BRANCH || git checkout -b $GIT_BRANCH
          git reset --hard origin/$GIT_BRANCH
          # Očisti macOS meta fajlove (nije obavezno)
          find . -name .DS_Store -delete || true
          find . -name '._*' -delete || true
          LATEST_BACKUP=\$(ls -1t /tmp/wp-config.server.backup.* 2>/dev/null | head -n 1 || true)
          if [ -n \"\${LATEST_BACKUP:-}\" ]; then cp \${LATEST_BACKUP} wp-config.php; fi
          sudo /opt/bitnami/ctlscript.sh restart apache || sudo /opt/bitnami/ctlscript.sh restart
          echo Deploy završen.
        '"

artifacts:
  files:
    - '**/*'
  discard-paths: yes
