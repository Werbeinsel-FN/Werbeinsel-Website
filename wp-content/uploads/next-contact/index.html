                </div>

                  document.addEventListener("DOMContentLoaded", function () {

                    hidePluginBtn();
                    var ro = new MutationObserver(hidePluginBtn);

                    var cb = document.getElementById("wi-privacy-checkbox");
                    var errWrap = document.getElementById("wi-privacy-error-wrap");
                    var msgText = "Bitte akzeptieren Sie die Datenschutzerklärung.";
                    if (cb && errWrap) {

                        if (cb.checked) errWrap.classList.add("hidden");

                          errWrap.classList.remove("hidden");

                          if (err) err.textContent = msgText;

                      cb.addEventListener("change", updateMessage);
